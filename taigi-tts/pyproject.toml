[project]
name = "ama-taigi-tts"
version = "0.1.0"
description = "Internal Taiwanese TTS service for Ama's Translator"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.32.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taigi_tts"]
