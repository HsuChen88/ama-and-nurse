[project]
name = "backend"
version = "0.1.0"
description = "Mock translation API for Ama's Translator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.0,<1",
    "pydantic-settings>=2.10.1,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.37.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=8.4.2,<10",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
