services:
  inference:
    build:
      context: ../../inference
      # The host firewall drops forwarded traffic from docker0/BuildKit networks,
      # so RUN steps use the host network stack instead.
      network: host
    restart: unless-stopped
    environment:
      INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:?set INFERENCE_API_TOKEN}
      INFERENCE_DEVICE: cuda
      INFERENCE_COMPUTE_TYPE: ${INFERENCE_COMPUTE_TYPE:-float16}
      INFERENCE_PRELOAD: ${INFERENCE_PRELOAD:-nan-TW,id}
      INFERENCE_MAX_QUEUE: ${INFERENCE_MAX_QUEUE:-10}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      ASR_NAN_MODEL: ${ASR_NAN_MODEL:-weemed/Breeze-ASR-26-ct2}
      ASR_ID_MODEL: ${ASR_ID_MODEL:-mobiuslabsgmbh/faster-whisper-large-v3-turbo}
      TAIGI_TTS_URL: http://taigi-tts:8002
      TAIGI_TTS_TIMEOUT_SECONDS: ${TAIGI_TTS_TIMEOUT_SECONDS:-30}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - taigi-tts

  taigi-tts:
    build:
      context: ../../taigi-tts
      network: none
      args:
        BASE_IMAGE: ${TAIGI_TTS_BASE_IMAGE:-taigi-tts-taigi-tts-poc:latest}
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      LLAMA_DTYPE: ${LLAMA_DTYPE:-fp16}
      TAIGI_TTS_MAX_QUEUE: ${TAIGI_TTS_MAX_QUEUE:-2}
      TAIGI_TTS_CACHE_MAX_ITEMS: ${TAIGI_TTS_CACHE_MAX_ITEMS:-128}
      TAIGI_TTS_MODEL_VERSION: ${TAIGI_TTS_MODEL_VERSION:-taigi-llama-2-7b+gpt-sovits-tw-r4-e15-v2protw}
      TAIGI_TTS_CACHE_DIR: /cache
      TW_TTS_OUT: /cache/tw-synth
      TW_TTS_REF: ${TW_TTS_REF:-/opt/GPT-SoVITS/tw_samples/ref_001.wav}
      TW_TTS_REF_TEXT: ${TW_TTS_REF_TEXT:-}
    volumes:
      - taigi-poc-models:/models:ro
      - taigi-tts-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - inference

volumes:
  huggingface-cache:
  taigi-tts-cache:
  taigi-poc-models:
    external: true

# Only this pre-created bridge (br-wasn-egress) is allowed outbound by the host firewall.
networks:
  default:
    name: ${DOCKER_EGRESS_NETWORK:-wasn-egress}
    external: true
